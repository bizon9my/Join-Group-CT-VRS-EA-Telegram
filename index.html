<!DOCTYPE html>
<html lang="ms">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paparan Baharu - Visual Lembut</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Menggunakan rendering standard untuk mengelakkan imej terlalu tajam/pecah */
        img {
            image-rendering: auto;
        }
        /* Menghilangkan highlight biru semasa klik di peranti mudah alih */
        a, img {
            -webkit-tap-highlight-color: transparent;
        }
    </style>
</head>
<body class="bg-gray-900 min-h-screen flex flex-col items-center justify-center p-4 sm:p-8 antialiased">

    <!-- Bekas utama yang seimbang untuk paparan mobile dan desktop -->

        <!-- 
          Gambar dengan pautan Telegram.
          Imej telah dikemas kini kepada versi (5).
          mix-blend-lighten dikekalkan untuk membantu integrasi latar belakang.
        -->

           target="_blank" 
           rel="noopener noreferrer" 
           class="w-full block cursor-pointer transition-all duration-300 active:scale-95 md:hover:scale-[1.01]">

                src="https://i.postimg.cc/fWxnYykJ/1-Klik-Join-Copytrade-VRS-EA-2-Klik-3-Dot-3-Klik-Open-in-browser-(5).png"

</body>
</html>
