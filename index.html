<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paparan Baharu - Sharp HD</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Teknik untuk mengurangkan kekaburan semasa gambar ditarik */
        img {
            image-rendering: -webkit-optimize-contrast; /* Untuk Chrome/Safari */
            image-rendering: crisp-edges;               /* Untuk Firefox */
            image-rendering: pixelated;                 /* Alternatif untuk ketajaman */
            -ms-interpolation-mode: nearest-neighbor;   /* Untuk IE lama */
        }
        /* Menghilangkan highlight biru semasa klik di mobile */
        a, img {
            -webkit-tap-highlight-color: transparent;
        }
    </style>
</head>
<body class="bg-gray-900 min-h-screen flex flex-col items-center justify-center p-2 sm:p-8 antialiased">

    <!-- 
      Bekas utama dikecilkan sedikit ke max-w-md (448px). 
      Ini mengelakkan gambar ditarik terlalu lebar yang menyebabkan kabur.
    -->
    <div class="w-full max-w-md text-center flex flex-col items-center" id="ruang-gambar">
        
        <!-- Gambar pertama -->
        <div class="w-full relative z-10">
            <img 
                src="https://i.postimg.cc/PJzDp4dQ/1-Klik-Join-Copytrade-VRS-EA-2-Klik-3-Dot-3-Klik-Open-in-browser-(3).png" 
                alt="Langkah-langkah tetapan" 
                class="w-full h-auto object-contain"
            />
        </div>
        
        <!-- 
          Gambar kedua dengan pautan Telegram:
          Dilaraskan semula margin negatif untuk saiz max-w-md.
          -mt-[51%] + offset dilaraskan supaya sepadan dengan saiz bekas baharu.
        -->
        <a href="https://t.me/+qCu5B_jduchhODI1" 
           target="_blank" 
           rel="noopener noreferrer" 
           class="relative z-20 -mt-[calc(51%-100px)] w-full block cursor-pointer transition-all duration-300 active:scale-95 md:hover:scale-[1.02] md:hover:brightness-110">
            <img 
                src="https://i.postimg.cc/VN1FKdVM/1-Klik-Join-Copytrade-VRS-EA-2-Klik-3-Dot-3-Klik-Open-in-browser-(2).png" 
                alt="Sertai Copytrade VRS EA" 
                class="w-full h-auto object-contain"
            />
        </a>

    </div>

</body>
</html>
